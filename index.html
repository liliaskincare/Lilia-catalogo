<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lilia Skincare — Catálogo de Productos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap');

  :root{
    --blue:#BBD7EA;
    --blue-deep:#8FB4D6;
    --blue-ink:#5F84A3;
    --pink:#F7C7CE;
    --pink-deep:#EFA3AF;
    --cream:#FFF6E6;
    --beige:#E8DED1;
    --brown:#8D6E63;
    --brown-dark:#5B4340;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Montserrat', sans-serif;
    background:var(--cream);
    color:var(--brown-dark);
    padding-bottom:60px;
  }

  /* ============ HEADER ============ */
  header{
    text-align:center;
    padding:56px 20px 34px;
    position:relative;
  }
  .logo-script{
    font-family:'Allura', cursive;
    font-size:76px;
    color:var(--blue-deep);
    line-height:1;
  }
  .logo-sub{
    font-size:13px;
    letter-spacing:8px;
    margin-top:2px;
    color:var(--brown-dark);
  }
  .logo-tag{
    font-size:11px;
    letter-spacing:2px;
    font-style:italic;
    color:var(--pink-deep);
    margin-top:8px;
  }
  .catalog-title{
    margin-top:30px;
    font-size:12px;
    letter-spacing:6px;
    text-transform:uppercase;
    color:var(--blue-ink);
  }

  /* decorative blossoms */
  .deco{ position:absolute; opacity:0.9; }

  /* ============ FILTER BAR ============ */
  .filter-bar{
    max-width:900px;
    margin:34px auto 10px;
    padding:0 20px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    align-items:center;
  }
  .chip{
    border:1px solid var(--beige);
    background:#fff;
    color:var(--brown-dark);
    font-size:12px;
    letter-spacing:1px;
    padding:9px 20px;
    border-radius:30px;
    cursor:pointer;
    transition:all .2s ease;
    font-family:'Montserrat', sans-serif;
  }
  .chip:hover{ border-color:var(--blue-deep); }
  .chip.active{
    background:var(--blue-deep);
    color:#fff;
    border-color:var(--blue-deep);
  }
  .search-wrap{
    max-width:420px;
    margin:18px auto 0;
    padding:0 20px;
  }
  .search-wrap input{
    width:100%;
    padding:12px 18px;
    border-radius:30px;
    border:1px solid var(--beige);
    background:#fff;
    font-family:'Montserrat', sans-serif;
    font-size:13px;
    color:var(--brown-dark);
    outline:none;
  }
  .search-wrap input:focus{ border-color:var(--blue-deep); }
  .search-wrap input::placeholder{ color:#b8a99e; }

  .results-count{
    text-align:center;
    font-size:11px;
    color:var(--brown);
    opacity:0.65;
    margin-top:14px;
    letter-spacing:1px;
  }

  /* ============ GRID ============ */
  .grid{
    max-width:1180px;
    margin:30px auto 0;
    padding:0 24px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:26px;
  }

  .card{
    background:#fff;
    border-radius:14px;
    border:1px solid var(--beige);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 30px rgba(141,110,99,0.14);
  }

  .card-visual{
    background:#ffffff;
    height:190px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    border-bottom:1px solid var(--beige);
  }
  .card-visual svg{ width:82px; height:82px; }
  .prod-photo{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:16px;
  }
  .cat-tag{
    position:absolute;
    top:12px; left:12px;
    background:var(--blue);
    color:#3d5a70;
    font-size:9.5px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:5px 12px;
    border-radius:20px;
  }
  .skin-tag{
    position:absolute;
    top:12px; right:12px;
    background:var(--cream);
    border:1px solid var(--beige);
    color:var(--brown);
    font-size:9px;
    letter-spacing:1px;
    padding:5px 10px;
    border-radius:20px;
    max-width:52%;
    text-align:right;
    line-height:1.3;
  }

  .card-body{
    padding:20px 22px 22px;
    display:flex;
    flex-direction:column;
    flex:1;
    background:
      radial-gradient(circle at bottom right, rgba(247,199,206,0.55) 0%, rgba(247,199,206,0) 50%),
      var(--blue);
    position:relative;
  }
  .brand{
    font-size:10.5px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#8a4a55;
    margin-bottom:4px;
  }
  .pname{
    font-size:16.5px;
    font-weight:600;
    line-height:1.3;
    color:var(--brown-dark);
    margin-bottom:6px;
  }
  .size{
    font-size:11.5px;
    color:#3d5a70;
    opacity:0.85;
    margin-bottom:14px;
  }

  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:16px;
  }
  .tag{
    background:rgba(255,255,255,0.75);
    border:1px solid rgba(255,255,255,0.9);
    font-size:10px;
    padding:4px 10px;
    border-radius:20px;
    color:var(--brown-dark);
  }

  .price-row{
    margin-top:auto;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding-top:14px;
    border-top:1px solid rgba(255,255,255,0.6);
  }
  .price{
    font-size:20px;
    font-weight:700;
    color:#3d5a70;
  }
  .price small{ font-size:11px; font-weight:500; color:var(--brown-dark); margin-left:3px;}

  .details-btn{
    background:none;
    border:none;
    font-family:'Montserrat', sans-serif;
    font-size:10.5px;
    letter-spacing:1px;
    color:var(--brown-dark);
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }

  .full-ingredients{
    display:none;
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed rgba(255,255,255,0.7);
    font-size:10.5px;
    line-height:1.7;
    color:#3d4d5c;
  }
  .full-ingredients.open{ display:block; }
  .full-ingredients b{ color:var(--brown-dark); display:block; margin-bottom:4px; font-size:10px; letter-spacing:1px; text-transform:uppercase;}

  /* ============ FOOTER ============ */
  footer{
    text-align:center;
    margin-top:70px;
    padding-top:30px;
  }
  .footer-line{
    width:220px;
    height:1px;
    background:var(--blue);
    margin:0 auto 18px;
  }
  footer .tag{
    background:none;
    border:none;
    font-family:'Allura', cursive;
    font-size:22px;
    color:var(--blue-deep);
  }
  footer p{
    font-size:10px;
    letter-spacing:2px;
    color:var(--brown);
    opacity:0.6;
    margin-top:8px;
  }

  @media (max-width:520px){
    .logo-script{ font-size:56px; }
    .grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

  <symbol id="ic-stick" viewBox="0 0 100 100">

</svg>

let activeFilter = "Todos";
let searchTerm = "";

function render(){
  const grid = document.getElementById('grid');
  const filtered = products.filter(p=>{
    const matchesFilter = activeFilter === "Todos" || p.category === activeFilter;
    const haystack = (p.name+" "+p.brand+" "+p.keyTags.join(" ")+" "+p.ingredients).toLowerCase();
    const matchesSearch = haystack.includes(searchTerm.toLowerCase());
    return matchesFilter && matchesSearch;
  });

  document.getElementById('resultsCount').textContent =
    filtered.length + (filtered.length===1 ? " producto encontrado" : " productos encontrados");

  grid.innerHTML = filtered.map((p, i)=>`
    <div class="card">
      <div class="card-visual">
        <span class="cat-tag">${p.category}</span>
        <span class="skin-tag">${p.skin.split(',')[0].split(';')[0]}</span>
        ${p.photo ? `<img src="${p.photo}" alt="${p.name}" class="prod-photo">` : `<svg><use href="#${p.icon}"/></svg>`}
      </div>
      <div class="card-body">
        <div class="brand">${p.brand}</div>
        <div class="pname">${p.name}</div>
        <div class="size">${p.size}</div>
        <div class="tags">
          ${p.keyTags.map(t=>`<span class="tag">${t}</span>`).join('')}
        </div>
        <div class="price-row">
          <div class="price">$${p.price}<small>COP</small></div>
          <button class="details-btn" onclick="toggleDetails(${i})">Ver ingredientes</button>
        </div>
        <div class="full-ingredients" id="ing-${i}">
          <b>Piel recomendada</b>
          ${p.skin}
          <b style="margin-top:10px;">Ingredientes (INCI)</b>
          ${p.ingredients}
        </div>
      </div>
    </div>
  `).join('');
}

function toggleDetails(i){
  const el = document.getElementById('ing-'+i);
  el.classList.toggle('open');
}

document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.filter;
    render();
  });
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  render();
});

render();
</script>
